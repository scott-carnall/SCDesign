<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blanket - SC Design</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="product.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <header>
  <div class="header-left">
    <a href="index.html">
      <img src="images/SCDesign.png" alt="SC Design Logo" class="logo" onerror="this.style.display='none'; this.parentElement.innerHTML='SC Design Store';" />
    </a>
  </div>
			<a href="cart.html" id="cart-count-link">
		  <div id="cart-icon">
			<i class="fas fa-shopping-cart"></i>
			<span id="cart-count-number">0</span>
		  </div>
		</a>
  </a>
</header>

  <main class="product-page">
    <div class="product-image">
      <img id="mainImage" src="images/quackattack.png" alt="Main Image" />
      <div class="thumbnail-row">
        <img class="thumbnail" src="images/quackattack.png" data-design="quackattack" />
        <img class="thumbnail" src="images/dark.png" data-design="dark" />
        <img class="thumbnail" src="images/stickerbomb.png" data-design="stickerbomb" />
      </div>
    </div>

    <div class="product-options">
      <h2 class="product-title">Custom Blanket</h2>

      <label for="design-select">Design:</label>
      <select id="design-select">
        <option value="quackattack">Quack Attack Is Back</option>
        <option value="dark">Dark Design</option>
        <option value="stickerbomb">StickerBomb</option>
      </select>

      <label for="size-select">Size:</label>
      <select id="size-select">
        <option value="small">Small</option>
        <option value="medium">Medium</option>
        <option value="large">Large</option>
      </select>

      <p id="price-display">£0.00</p>
      <button id="add-to-cart-btn">Add to Cart</button>
    </div>
  </main>
</body>
</html>
